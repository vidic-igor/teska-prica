backend:
  name: github
  repo: vidic-igor/teska-prica
  branch: main
  # Our own OAuth broker (worker/ in this repo). Without this line Decap
  # falls back to api.netlify.com, which only works for sites hosted on
  # Netlify. No trailing slash, no path.
  base_url: https://teska-prica-auth.igor-vidic92.workers.dev

media_folder: uploads
public_folder: /uploads

collections:
  - name: content
    label: Sadržaj sajta
    files:

      - name: venues
        label: "Katalog mesta"
        file: content/venues.json
        fields:
          - name: items
            label: "Mesta"
            widget: list
            summary: "{{fields.name}} — {{fields.city}}"
            fields:
              - { name: name, label: "Naziv mesta", widget: string }
              - { name: city, label: "Grad",        widget: string }
              - name: address
                label: "Adresa"
                widget: string
                required: false
                hint: "Npr. Trg slobode 1. Prikazuje se uz grad u rasporedu."
              - name: phone
                label: "Telefon za rezervacije"
                widget: string
                required: false
                hint: "Telefon mesta. Opciono. Može i više brojeva, npr. 024 555 111 / 060 123 4567."
              - name: mapUrl
                label: "Link sa Google mapa"
                widget: string
                required: false
                pattern: ['^$|^https://', "Mora počinjati sa https://"]
                hint: "Najtačnije: nađi mesto na Google mapama → Deli → Kopiraj link → nalepi ovde. Vidiš tačno mesto dok kopiraš, pa greška nije moguća. Bez ovoga se traži po nazivu, adresi i gradu." 

      - name: gigs
        label: Nastupi
        file: content/gigs.json
        fields:
          - name: items
            label: Nastupi
            widget: list
            summary: "{{fields.date}} — {{fields.venue}}"
            fields:
              - name: date
                label: "Datum nastupa"
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: "DD.MM.YYYY."
                time_format: false
                picker_utc: false
                hint: "Status (UPCOMING / PAST) i redosled se računaju sami iz ovog datuma."
              - name: venue
                label: "Mesto"
                widget: relation
                collection: content
                file: venues
                search_fields: ["items.*.name", "items.*.city"]
                display_fields: ["items.*.name", "items.*.city"]
                value_field: "items.*.name"
                required: false
                hint: "Izaberi iz kataloga mesta. Grad se povlači sam."
              - name: time
                label: "Početak"
                widget: datetime
                date_format: false
                time_format: "HH:mm"
                format: "HH:mm"
                required: false
                hint: "Opciono. Npr. 21:00."
              - name: noReservation
                label: "Bez rezervacije"
                widget: boolean
                default: false
                required: false
                hint: "Prikazuje „Bez rezervacije“ umesto telefona i linka."
              - name: reservationUrl
                label: "Link za rezervacije"
                widget: string
                required: false
                pattern: ['^$|^https://', "Mora počinjati sa https://"]
                hint: "Opciono. Stranica za rezervacije ili ulaznice."
              - { name: place, label: "Mesto — ručno", widget: string, required: false, hint: "Popuni samo ako mesta nema u katalogu." }
              - { name: city,  label: "Grad — ručno",  widget: string, required: false }
              - { name: note,      label: Napomena,  widget: string,  required: false, hint: "Opciono. Npr. „SOLD OUT“ ili „Prvi solistički koncert“." }
              - { name: highlight, label: Istaknuto, widget: boolean, default: false, required: false }

      - name: members
        label: "Članovi benda"
        file: content/members.json
        fields:
          - name: items
            label: "Članovi"
            widget: list
            fields:
              - { name: name, label: Ime,         widget: string }
              - { name: role, label: Uloga,       widget: string }
              - { name: img,  label: Fotografija, widget: image }

      - name: settings
        label: "Podešavanja i kontakt"
        file: content/settings.json
        fields:
          - { name: blurb,     label: "Opis benda",       widget: text }
          - { name: phone,     label: Telefon,            widget: string }
          - { name: email,     label: "E-mail",           widget: string }
          - { name: instagram, label: "Instagram (bez @)", widget: string }
          - { name: base,      label: "Baza / region",    widget: string }
          - name: video
            label: "Video snimak (kratak klip)"
            widget: file
            required: false
            hint: "MP4, 15–25 sek, do ~4 MB. Prikazuje se u galeriji, bez tona dok posetilac ne klikne."
          - name: videoPoster
            label: "Naslovna slika videa"
            widget: image
            required: false
            hint: "Prvi kadar klipa. Opciono."
          - name: pastVenues
            label: "Mesta gde smo svirali"
            widget: list
