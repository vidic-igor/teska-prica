backend:
  name: github
  repo: vidic-igor/teska-prica
  branch: main

media_folder: uploads
public_folder: /uploads

collections:
  - name: content
    label: Sadržaj sajta
    files:

      - name: venues
        label: "Katalog mesta"
        file: content/venues.json
        fields:
          - name: items
            label: "Mesta"
            widget: list
            summary: "{{fields.name}} — {{fields.city}}"
            fields:
              - { name: name, label: "Naziv mesta", widget: string }
              - { name: city, label: "Grad",        widget: string }

      - name: gigs
        label: Nastupi
        file: content/gigs.json
        fields:
          - name: items
            label: Nastupi
            widget: list
            summary: "{{fields.date}} — {{fields.venue}}"
            fields:
              - name: date
                label: "Datum nastupa"
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: "DD.MM.YYYY."
                time_format: false
                picker_utc: false
                hint: "Status (UPCOMING / PAST) i redosled se računaju sami iz ovog datuma."
              - name: venue
                label: "Mesto"
                widget: relation
                collection: content
                file: venues
                search_fields: ["items.*.name", "items.*.city"]
                display_fields: ["items.*.name", "items.*.city"]
                value_field: "items.*.name"
                required: false
                hint: "Izaberi iz kataloga mesta. Grad se povlači sam."
              - { name: place, label: "Mesto — ručno", widget: string, required: false, hint: "Popuni samo ako mesta nema u katalogu." }
              - { name: city,  label: "Grad — ručno",  widget: string, required: false }
              - { name: note,      label: Napomena,  widget: string }
              - { name: highlight, label: Istaknuto, widget: boolean, default: false }

      - name: members
        label: "Članovi benda"
        file: content/members.json
        fields:
          - name: items
            label: "Članovi"
            widget: list
            fields:
              - { name: name, label: Ime,         widget: string }
              - { name: role, label: Uloga,       widget: string }
              - { name: img,  label: Fotografija, widget: image }

      - name: settings
        label: "Podešavanja i kontakt"
        file: content/settings.json
        fields:
          - { name: blurb,     label: "Opis benda",       widget: text }
          - { name: phone,     label: Telefon,            widget: string }
          - { name: email,     label: "E-mail",           widget: string }
          - { name: instagram, label: "Instagram (bez @)", widget: string }
          - { name: base,      label: "Baza / region",    widget: string }
          - name: pastVenues
            label: "Mesta gde smo svirali"
            widget: list
