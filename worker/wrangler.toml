name = "teska-prica-auth"
main = "src/index.js"
compatibility_date = "2026-11-07"

# Expose the broker on <name>.<subdomain>.workers.dev. Without this the Worker
# deploys but the workers.dev hostname answers 404.
workers_dev = true

# Deploys fail if this secret is not already on the Worker. Names only -
# never values. This is the guard that catches the secret landing on the
# wrong Worker.
[secrets]
required = ["GITHUB_OAUTH_SECRET"]

[vars]
# Origins allowed to receive the OAuth token. This is the site the CMS runs on,
# not this Worker. Add the old *.netlify.app origin too if /admin still needs
# to work there during the migration.
SITE_ORIGINS = "https://teska-prica.igor-vidic92.workers.dev"

# The repo is public, so public_repo is enough to let the CMS commit.
GITHUB_SCOPE = "public_repo,user"

# Public half of the GitHub OAuth App. Not a secret; it ships in the auth URL.
# Do not try to tell OAuth Apps from GitHub Apps by this prefix - check which
# list the app appears under in GitHub settings instead.
GITHUB_OAUTH_ID = "Ov23li9Y0sEKYS3oSaJc"

# GITHUB_OAUTH_SECRET is never stored here. Set it once with:
#   npx wrangler secret put GITHUB_OAUTH_SECRET
