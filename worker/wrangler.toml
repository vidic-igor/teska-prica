name = "teska-prica-auth"
main = "src/index.js"
compatibility_date = "2026-11-07"

[vars]
# Origins allowed to receive the OAuth token. This is the site the CMS runs on,
# not this Worker. Add the old *.netlify.app origin too if /admin still needs
# to work there during the migration.
SITE_ORIGINS = "https://teska-prica.igor-vidic92.workers.dev"

# The repo is public, so public_repo is enough to let the CMS commit.
GITHUB_SCOPE = "public_repo,user"

# Public half of the GitHub OAuth App. Fill this in before deploying.
GITHUB_OAUTH_ID = "REPLACE_WITH_GITHUB_OAUTH_CLIENT_ID"

# GITHUB_OAUTH_SECRET is never stored here. Set it once with:
#   npx wrangler secret put GITHUB_OAUTH_SECRET
